version: "3.3"

services:
  local-flex-1:
    image: ${PDK_TEST_FLEX_IMAGE_NAME:-mulesoft/flex-gateway}:${PDK_TEST_FLEX_IMAGE_VERSION:-1.13.4}
    ports:
      - 8081:8081
    volumes:
      - ./config:/usr/local/share/mulesoft/flex-gateway/conf.d/
    depends_on:
      - redis
    environment:
      - FLEX_INSTANCE_ID=flex-1

  local-flex-2:
    image: ${PDK_TEST_FLEX_IMAGE_NAME:-mulesoft/flex-gateway}:${PDK_TEST_FLEX_IMAGE_VERSION:-1.13.4}
    ports:
      - 8082:8081
    volumes:
      - ./config:/usr/local/share/mulesoft/flex-gateway/conf.d/
    depends_on:
      - redis
    environment:
      - FLEX_INSTANCE_ID=flex-2

  backend:
    image: kennethreitz/httpbin
    ports:
      - 8080:80

  redis:
    image: redis:7.2-alpine
    ports:
      - 6379:6379
