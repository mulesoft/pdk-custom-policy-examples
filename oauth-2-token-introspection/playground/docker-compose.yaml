version: "3.3"

services:
  local-flex:
    image: ${PDK_TEST_FLEX_IMAGE_NAME:-mulesoft/flex-gateway}:${PDK_TEST_FLEX_IMAGE_VERSION:-1.13.4}
    ports:
      - 8081:8081
    volumes:
      - ./config:/usr/local/share/mulesoft/flex-gateway/conf.d/
  backend:
    image: kennethreitz/httpbin
  oauth-server:
    image: colinodell/static-response-server
    environment:
      - "HTTP_CODE=200"
      - 'HTTP_BODY={"active":true, "scope": "read write"}'
      - "HTTP_HEADERS=Content-Type: application/json"
