[package]
name = "pii_redaction"
version = "1.0.0"
rust-version = "1.88.0"
edition = "2018"
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.anypoint]
group_id = "b1046b50-fb6e-4b79-9d37-2777a832d6c0"
definition_asset_id = "pii-redaction"
implementation_asset_id = "pii-redaction-flex"

[dependencies]
pdk = { version = "1.9.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
anyhow = "1.0"
regex = "1.11"

[dev-dependencies]
pdk-unit = { version = "1.9.0" }
criterion = { version = "0.5", features = ["html_reports"] }

[lib]
# `rlib` is added alongside `cdylib` so the criterion benchmark (a separate
# crate) can import this policy and drive it through pdk-unit.
crate-type = ["cdylib", "rlib"]

[[bench]]
name = "redaction"
harness = false

[profile.release]
lto = true
opt-level = 'z'
strip = "debuginfo"
